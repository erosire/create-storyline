          description: L-7 — the phase the Story moved to; null when the lock IS the completion (L-25a).
        voided_findings:
          type: integer
          description: >-
            R3 — findings open ON THE SUMMARY PHRASE that the accept voided to `discarded`. Phrase-scoped: a
            claim naming a Plotlines entry is not counted and is not moved.
        wontfixed_tasks:
          type: integer
          description: R3 — queued jobs the accept closed as `wontfix` (`open` and `claimed`; §4.7).
        phrase_started:
          type: boolean
          description: >-
            R4 — true only when THIS accept created the Plotlines Phrase, seeded from the compiled Summary.
        phrase_start_reason:
          type: string
          description: >-
            Empty when it started; otherwise the sentence the rail shows under a successful accept, naming
            the one move that finishes the job.
