          type: boolean
    AgentModelCatalog:
      type: object
      required: [base_url, models]
      additionalProperties: false
      properties:
        base_url:
          type: string
        models:
          type: array
          items:
            type: string
    LoopSettings:
      type: object
      required: [global_max_concurrent, live_runs]
      additionalProperties: false
      properties:
        global_max_concurrent:
          type: integer
          minimum: 1
        live_runs:
