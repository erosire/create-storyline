    # ---------------------------------------------------------------------
    # Request bodies
    # ---------------------------------------------------------------------
    CreateStoryRequest:
      type: object
      required: [idea]
      additionalProperties: false
      properties:
        title:
          type: string
        idea:
          type: string
          minLength: 1
          description: P5's Seed. A blank or whitespace-only value is 400.
        chapter_count:
          type: integer
          minimum: 1
        summary_mode:
          type: string
          enum: [groups, sampling]
          description: >-
            How phase ① writes the Summary. `groups` (the default for a NEW Story) makes the five
            catalog groups the unit of work: one Writer pass per batch, each accepted result installed
            as that group's next revision, no whole-Summary sampling and no draft selection (R5).
            `sampling` keeps the pre-redesign pipeline. Omitting it is the NEW default, not the old
            behaviour — an existing book with no `summary_mode` on its row is legacy by definition and
            needs no migration (R6). A value outside the two words is 400, because a typo would
            otherwise book the Author into a pipeline they did not ask for.
        plotlines_mode:
          type: string
          enum: [groups, classic]
          description: >-
            R11 — how phase ② writes the chapter set, the same KIND of switch as `summary_mode` and an
            independent one. `groups` (the default for a NEW Story) makes the chapter catalog — one
            `phrase_groups` row per chapter the accepted brief declares — the unit of work, and the
            Author's verbs on those rows are the surface (P3). `classic` keeps the pre-redesign plotline
            tools as the writers of `plotlines` contract rows; omitting the key on a PATCH means leave it
            alone, while an existing book with no `plotlines_mode` on its row is classic by definition (R6 applied to this dial
            — no migration writes a field that is absent). A value outside the two words is 400.
    PhraseView:
      type: object
      additionalProperties: false
      required: [story_id, mode, phrase_id, revision, overview, groups, findings, tasks, review, reviewed]
      properties:
        story_id:
          type: string
        mode:
          type: string
          enum: [groups, sampling]
          description: >-
            `story.summary_mode`, echoed rather than derived (R6): the switch is a Setting, so a book
            with group rows it has not opted into still reads `sampling`.
        phrase_id:
          type: string
          nullable: true
          description: The Summary Phrase row, or null on a book that has none yet (R6's legacy shape).
        revision:
          type: integer
          minimum: 0
          description: The Overview's revision number — the phrase row's, incremented by each install.
        overview:
          type: string
          description: >-
            The composed Overview, read from the group rows (R2): `## <title>` per non-empty group in
            catalog order, one blank line between them. A read, never a stored second source.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PhraseGroupRow'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/PhraseFindingRow'
        tasks:
          type: array
          description: The tasks that are not `done` — the queue the group pipeline is working through.
          items:
            $ref: '#/components/schemas/PhraseTaskRow'
        review:
          $ref: '#/components/schemas/PhraseReviewState'
        reviewed:
          $ref: '#/components/schemas/PhraseReviewedSummary'
    PhraseDetailView:
      type: object
      description: >-
        ONE phrase's rail read — the `PhraseView` shape widened with what a phrase OTHER than the Summary
        needs (R11 / D-76), and a superset BY CONSTRUCTION: `GET …/phrases` and the Summary leg of this
        read come from one projection (`api/projections.ts`), so the two cannot drift and the three fields
        below are the whole delta. Every number here belongs to THIS phrase: `groups` is its catalog rows
        (the five Summary sections, or the chapter rows Phrase ②'s brief declares), `findings` are the
        claims naming those rows, and `review` counts the seats that have reported on that text. `tasks`
        are the Story's open queue — a §4.10 task carries no phrase column, so the rail shows the queue the
        loop is working rather than a slice invented by the projection.
      additionalProperties: false
      required:
        [
          story_id,
          phrase_id,
          key,
          mode,
          revision,
          overview,
          groups,
          findings,
          tasks,
          review,
          reviewed,
          seed_chars,
          brief
        ]
      properties:
        story_id:
          type: string
        phrase_id:
          type: string
          nullable: true
          description: >-
            THIS phrase's `phrases.id` (① or ②), or null on a book that has no row for it yet — an
            unwritten phrase still answers the empty shape (R6's rule, generalised to every phrase).
        key:
          type: string
          enum: [summary, plotlines]
          description: >-
            The §4.11 catalog key this read belongs to, echoed so a rail can assert it is holding the right
            phrase rather than trusting the URL it typed.
        mode:
          type: string
          enum: [groups, sampling, classic]
          description: >-
            THE SWITCH THAT OPENED THIS PHRASE's verbs, read off the Story row (P4 — what a rail's disabled
            button and this field must agree on). `groups` for either phrase whose switch is on; `sampling`
            is the Summary's legacy word and `classic` is Phrase ②'s, so the SAME value means the two
            phases' off-states differently and the wording of a refusal differs by exactly this field. On a
            book that never got either field, the Summary reads `sampling` and Phrase ② reads `classic` —
            an absent switch is the old pipeline, never a silently-open phrase (R6 applied to this dial).
        revision:
          type: integer
          minimum: 0
          description: This phrase's Overview revision number — its Phrase row's, incremented by each install.
        overview:
          type: string
          description: >-
            The composed Overview of THIS phrase's rows (R2): `## <title>` per non-empty group in catalog
            order, one blank line between them. A read, never a stored second source.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PhraseGroupRow'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/PhraseFindingRow'
        tasks:
          type: array
          description: >-
            The Story's tasks that are not `done`. Story-scoped rather than phrase-scoped on purpose: a
            §4.10 `Task` row has no phrase column, so a rail cannot claim a subset the store does not hold.
          items:
            $ref: '#/components/schemas/PhraseTaskRow'
        review:
          $ref: '#/components/schemas/PhraseReviewState'
        reviewed:
          $ref: '#/components/schemas/PhraseReviewedSummary'
        seed_chars:
          type: integer
          minimum: 0
          description: >-
            The EXACT length of the Seed this phrase is written from — its Phrase row's copied `seed`
            (D-72), or the Story's own Seed on a phrase that has no row yet, which is the text it would
            copy if it were started now. 0 when neither has text. The full Seed is deliberately not on the
            wire: it is the prompt input, and the rail shows its size and a window of it.
        seed_head:
          type: string
          description: >-
            The leading window of that Seed — at most 400 characters, whole, so `seed_chars` stays the full
            length even when this string is shorter. It is the same read every phrase-level gate uses
            (`phrase/catalog.ts:phraseSeedOf`), which is what lets the rail show the Author WHICH text the
            crew was started on and prove it did not move when Phrase ① was edited afterwards.
        brief:
          nullable: true
          description: >-
            This phrase's own brief (§4.11's rail rule, R11): today Phrase ②'s chapter plan, and the same
            slot carries Phrase ③'s when that wave starts it. Null for a phrase that has no brief row — the
            Summary's read always answers null.
          allOf:
            - $ref: '#/components/schemas/PhraseBriefView'
    PhraseBriefView:
      type: object
      description: >-
        A phrase's brief in the shape §4.11 says every phrase's rail carries (R11). Today there is one:
        Phrase ②'s chapter plan — the newest `plotline_briefs` row THIS phrase owns (newest by `created_at`,
        the phrase id as tie-break, which is the same pick order the loop's prompt compiler uses), the state
        of the plan (a `draft` the Editor answered or an `accepted` one the Author signed), how many chapters
        it declares, and when it was accepted. The projection is phrase-keyed, so Phrase ③'s chapter brief
        lands in the same slot under `key: chapters` when that wave starts it.
      additionalProperties: false
      required: [status, chapter_count]
      properties:
        status:
          type: string
          enum: [draft, accepted]
        chapter_count:
          type: integer
          minimum: 0
          description: The chapters the plan declares — Author truth, and the count the catalog is seeded to (D-3b).
        accepted_at:
          type: string
          format: date-time
          description: >-
            Present ONLY on an accepted plan, and it is the brief row's own `updated_at` — the moment the
            accept wrote `status: 'accepted'`, which is the only thing that moves that row after it was
            created. §4's brief row carries no timestamp of its own, so this is the honest read of WHEN the
            plan became truth rather than a second stamp the store does not hold.
    PhraseReviewedSummary:
      type: object
      additionalProperties: false
      required: [state, complete, vector, vector_hash, overview, groups, chosen, stale, blocking_issues, writer_busy]
      description: >-
        D-67/D-68 — the Reviewed Summary: the newest CLEAN revision of every group composed into one
        Overview, the Reader scores that judged exactly that text, and the Author's recorded choice.
        Always present, so a client never branches on absence; a book with no groups simply reports
        `state: pending` with no groups. Every number in here is a READ of rows — the selection is the
        newest Clean revision per group whose group carries no unresolved issue, the choice is the
        Phrase row's recorded vector re-validated against the rows, and the scores join on `vector_hash`
        — so a restart changes nothing and two reads in one instant cannot disagree.
      properties:
        state:
          type: string
          enum: [pending, ready, chosen]
          description: >-
            `pending` — no complete clean selection and no valid choice; `ready` — a complete reviewed
            Overview the Author has not chosen (including the case where they chose earlier and the
            pipeline has since reviewed a different combination, which is also `stale: true`); `chosen`
            — the Author's choice stands and there is nothing newer to take. Immediately after a choose
            this is `chosen` even though the selection looks empty: the chosen rows are the live
            `latest` rows, they carry no Clean stamp (nobody has re-read them), and the choice record is
            the only reviewed Summary the book has.
        complete:
          type: boolean
          description: >-
            Every group has a selectable Clean revision. This is the gate a choose hangs on, and the
            gate the Reader's scoring seat arms on (D-67) — half a reviewed Summary is neither.
        vector:
          type: object
          additionalProperties:
            type: integer
          description: '`{group_id: revision_number}` for the groups that HAVE a selection; partial when `complete` is false.'
        vector_hash:
          type: string
          description: >-
            `groupVectorHash(vector)` — the identity the Reader's score rows and the scoring seat's claim
            key are both keyed by, so the text shown, the text scored and the recorded hash agree.
        overview:
          type: string
          description: >-
            The composed reviewed Overview — the five selected texts, joined exactly as the live Overview
            is. Empty while the selection is partial. After a choose it equals `overview`, because the
            choice installed exactly these bytes.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PhraseReviewedGroup'
        chosen:
          nullable: true
          description: >-
            The Author's choice, or null when they never chose — or when the chosen history is gone,
            which is what a Seed reset or a scrap does to a recorded choice (the read re-validates every
            named row and refuses to report a text the book no longer holds).
          allOf:
            - $ref: '#/components/schemas/PhraseChosenSummary'
        stale:
          type: boolean
          description: >-
            True when the clean selection has moved PAST what the Author chose — there is newer reviewed
            text to take.
        blocking_issues:
          type: array
          description: >-
            The unresolved ISSUE rows holding a clean verdict back, each naming the group KEYS it scopes
            to (an unscoped finding names all five, which is R3's reading and why it blocks all five).
          items:
            type: object
            additionalProperties: false
            required: [id, title, cost, group_keys]
            properties:
              id:
                type: string
              title:
                type: string
              cost:
                type: string
                enum: [critical, major, minor, taste]
              group_keys:
                type: array
                items:
                  type: string
        writer_busy:
          type: boolean
          description: >-
            A live Writer pass holds at least one group, so `POST …/phrases/reviewed/choose` would
            refuse. The same read the route refuses with, so a disabled control and a 409 agree (R4).
    PhraseReviewedGroup:
      type: object
      additionalProperties: false
      required: [id, key, selected_revision, selected_id, clean_run_ref, latest_revision, superseded, issues_open, gap, scores]
      description: >-
        One section of the Reviewed Summary. It exists because the live group row and the reviewed
        section legitimately differ: the newest Ending may carry an open defect while the Ending the
        crew stands behind is an earlier revision, and the rail has to be able to say so.
      properties:
        id:
          type: string
        key:
          type: string
        selected_revision:
          type: integer
          nullable: true
          description: The Clean revision this section stands behind, or null while the group has none.
        selected_id:
          type: string
          nullable: true
          description: The `group_revisions` row behind `selected_revision`, so the rail can open the text.
        clean_run_ref:
          type: string
          nullable: true
          description: The deep-review run whose clean pass earned the stamp (P11's audit of the verdict).
        latest_revision:
          type: integer
          description: The group's newest revision number (0 when unwritten) — the number the selection fell back past.
        superseded:
          type: boolean
          description: True when the newest text is NOT the reviewed one, which is the state the Author acts on.
        issues_open:
          type: boolean
          description: An unresolved issue names this group, which blocks its clean verdicts from being selected.
        gap:
          type: string
          nullable: true
          enum: [unwritten, no_clean_revision, null]
          description: Why there is no selection — null when there is one.
        scores:
          type: array
          description: >-
            The Reader scores judged against THIS reviewed vector, newest first. The join is the row's
            `vector_hash` and nothing else: a number describes the text it was shown. The same rows are
            also on `groups[].scores` with their hashes (D-65's trend), so the rail reconciles nothing.
          items:
            $ref: '#/components/schemas/PhraseGroupScoreRow'
    PhraseChosenSummary:
      type: object
      additionalProperties: false
      required: [vector, vector_hash, at, overview, scores]
      description: What the Author chose, read back off the Phrase row (D-68).
      properties:
        vector:
          type: object
          additionalProperties:
            type: integer
          description: '`{group_id: revision_number}` — the vector the choice adopted (its rows are now `latest`).'
        vector_hash:
          type: string
        at:
          type: string
          description: When the choose committed (the Phrase row's `reviewed_at`).
        overview:
          type: string
          description: The composed text that was chosen, recomposed from the rows the vector names.
        scores:
          type: object
          description: '`{group_id: scores}` — the numbers that judged THAT text, newest first per group.'
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PhraseGroupScoreRow'
    PhraseGroupRow:
      type: object
      additionalProperties: false
      required: [id, key, title, description, order, content, revision, updated_by, previous_content, history, owed_by_findings, writer_busy, scores]
      properties:
        id:
          type: string
          description: The `phrase_groups.id` a revise call addresses.
        key:
          type: string
          enum: [premise, promise, theme, tone, ending]
          description: The catalog key — also the legacy `summaries` field this group mirrors (R6).
        title:
          type: string
        description:
          type: string
        order:
          type: integer
          description: Composition order; the Overview is built in this order and so is every batch.
        content:
          type: string
          description: The current text; empty means the group has never been written (revision 0).
        revision:
          type: integer
          minimum: 0
          description: The number of the `latest` row, per GROUP (R2 — one group never renumbers another).
        updated_by:
          type: string
          nullable: true
          description: The run that wrote the current text, or null for a legacy import or an Author edit.
        previous_content:
          type: string
          description: >-
            The text of the revision immediately before the latest one, verbatim, or '' when the group
            is at revision 1. It is the ONE archived body on this read, sent so the pane can show the
            latest revision as a diff against the one it replaced; every older revision stays metadata.
        history:
          type: array
          description: >-
            Every revision of this group, newest first, the superseded texts INCLUDED (R2: history is
            archived and retained, and hidden from the current view rather than deleted).
          items:
            $ref: '#/components/schemas/PhraseRevisionRow'
        owed_by_findings:
          type: array
          items:
            type: string
          description: >-
            Findings that target this group and have no revision of IT written to answer them (R3). This
            is the debt the next Writer batch is routed against.
        writer_busy:
          type: boolean
          description: >-
            A live Writer pass holds this group right now, so the text shown is about to move (R4). Derived
            from the Story's live `runs` rows rather than from a flag anyone sets, so it is the same answer
            the server gives after a restart and the same read `POST …/phrases/groups/{groupId}/revise`
            refuses a hand edit with — the dashboard disables its edit button off this flag and cannot
            disagree with the route. A live holding run that named no `group_refs` counts as holding every
            group of the Story.
        scores:
          type: array
          description: >-
            The Reader's judgements of THIS section (D-65), NEWEST FIRST, one entry per scoring run that
            covered the group. An EMPTY list means nobody has scored this text — it is not a zero and not
            a failure. `scores[0]` is the current number because the read sorts the stored rows by
            `created_at` descending with the row id as the tie-break (one scoring commit stamps all five
            rows with the same instant, so time alone cannot order them). The pass is DISPLAY work: no
            score value, and no scoring seat in any owed count, enters the criteria engine, drain
            threshold, hill-climb, sign-off gate or goal math — an IN-FLIGHT scoring run still counts as
            in-flight group-pipeline work (the run, never the number) — and what the loop DOES read back
            is a section's `rationale`, as evidence for the group-lock seat (R-lock, §17.18): the number
            is never compared to a threshold, and no score value gates anything.
          items:
            $ref: '#/components/schemas/PhraseGroupScoreRow'
        locked:
          type: boolean
          description: >-
            R-lock — TRUE while this group's CURRENT text is signed off. A lock is a flag on the row that
            already holds the text, never an edit: it writes no revision, touches no `content`, and
            recomposes nothing, so the words are byte-for-byte what they were and `locked_revision` names
            the revision a person committed to. While it stands, no install may rewrite the group (the
            batch that tries is refused WHOLE), the work generator never offers it, a finding whose EVERY
            named group is locked is `discarded`, and the other groups are the side revised for
            consistency. ABSENT means unlocked — the reading of every book written before the flag
            existed, and of a group whose lock the Author lifted — and the projection emits the field ONLY
            while a live lock stands, so a client must never cache it across reads.
        locked_revision:
          type: integer
          description: >-
            The revision number the CURRENT lock fixed — the group's `revision` at the instant of locking,
            so an audit can tell a lock from a later text that happens to carry the flag. Present only
            while a lock stands (the row stores `null` once unlocked, and `null` on the wire would be a
            number-shaped lie rather than an absence).
        locked_by:
          $ref: '#/components/schemas/PhraseGroupLockActor'
        locked_at:
          type: string
          format: date-time
          description: >-
            The lock commit's own stamp — when the decision was made, not when the text was written — in
            UTC: ISO-8601 with millisecond precision and a `Z` offset (e.g.
            `2026-11-25T09:00:00.000Z` — `server/tools/utilities.ts:nowIso`, the same stamp the lock result
            answers with, since the row and the report record one commit). The unlock writes no timestamp
            of its own, so this field disappears rather than moving.
    PhraseGroupScoreRow:
      type: object
      additionalProperties: false
      required: [value, vector_hash, at, run_ref]
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
          description: >-
            Out of 100, exactly as the Reader answered it. The projection never re-scales, averages or
            re-ranks a score; the range and the integer-ness are enforced at parse time
            (`phrase/section-scores.ts`), not recomputed here.
        vector_hash:
          type: string
          description: >-
            The group revision vector this score judged, read off the Work Item's claim key rather than
            re-derived at settlement — so a Writer install DURING the pass cannot re-stamp an old
            judgement onto a new book. Compare it with `review.vector_hash` to tell whether the number
            describes the text on the record.
        at:
          type: string
          description: When the row was written (the stored record's `created_at`).
        run_ref:
          type: string
          description: The run that answered — the thread the Author can open to read the Reader's work.
        rationale:
          type: string
          description: >-
            The Reader's one-line reason for the number, WHEN IT GAVE ONE: the field is omitted rather
            than shipped as an empty string. The quoted `evidence` line stays server-side (the rail draws
            a percentage); it is in the run's thread behind `run_ref`.
    PhraseRevisionRow:
      type: object
      additionalProperties: false
      required: [id, number, state, at, run_ref, finding_refs, task_refs, chars, clean, clean_run_ref]
      properties:
        id:
          type: string
        number:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [latest, archived]
          description: >-
            The two positions a row in this list can hold. D-68 adds a THIRD stored state, `discarded`
            (the texts the Author's Reviewed-Summary choice passed over), and the view EXCLUDES those
            rows: they are retained for R3's closure join, not offered as candidates, so a history rail
            that listed them beside the live line would read as "these are still on the table". The
            choice itself is reported on `reviewed`, not here.
        at:
          type: string
        run_ref:
          type: string
          nullable: true
        finding_refs:
          type: array
          items:
            type: string
          description: The findings this text was written to answer — R3's closure anchor.
        task_refs:
          type: array
          items:
            type: string
        chars:
          type: integer
          description: The text's length; the body itself is not repeated per historical row.
        clean:
          type: boolean
          description: >-
            D-67 — the Clean stamp: this text was the group's text in a cross-group Critic pass that
            closed with no unresolved defect on the group. It is a verdict about THAT pass, so it never
            moves when a later finding is raised or discarded; what a later event moves is the
            SELECTION (see `reviewed`), which is why a row can be clean and still not be what the
            reviewed Overview stands behind.
        clean_run_ref:
          type: string
          nullable: true
          description: The deep-review run whose clean pass earned the stamp — P11's audit of the verdict.
    PhraseFindingRow:
      type: object
      additionalProperties: false
      required: [id, title, cost, kind, state, seen_count, group_refs, unscoped, targeted, resolved, missing, resolved_all]
      properties:
        id:
          type: string
        title:
          type: string
        cost:
          type: string
          enum: [critical, major, minor, taste]
        kind:
          type: string
          enum: [issue, proposal]
          description: >-
            D-33b — which of the two claims this row is, so the rail can tell a defect from a proposal
            without guessing at the title. `issue` claims a break the artifact must answer by quotation;
            `proposal` proposes a change the Seed never promised, which the Editor weighs on merit
            (worth a Writer pass? does it contradict the installed text?) and never for resting on an
            absence. Defaulted on the way out by `api/projections.ts:phraseView`: a row raised before
            the field existed reads as `issue`, so a client never interprets absence. The rail's layout
            stays kind-blind — this is data the read carries, not a badge it draws.
        state:
          type: string
          enum: [unconfirmed, confirmed, approved, fixed, disputed, discarded]
        seen_count:
          type: integer
        group_refs:
          type: array
          items:
            type: string
          description: The group ids on the record; empty is the legacy "the whole Overview" reading.
        unscoped:
          type: boolean
          description: True when the record named no group, spelled out so no client infers it from emptiness.
        targeted:
          type: array
          items:
            type: string
          description: The groups it targets after the book's own rows are applied, in catalog order.
        resolved:
          type: array
          items:
            type: string
        missing:
          type: array
          items:
            type: string
          description: The targeted groups still owed a revision. Empty means the finding may close.
        resolved_all:
          type: boolean
          description: R3 — every targeted group has a revision written to answer it.
    PhraseTaskRow:
      type: object
      additionalProperties: false
      required: [id, title, state, owner_role, attempts, finding_ref]
      properties:
        id:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [open, claimed, blocked, done, wontfix]
        owner_role:
          type: string
          nullable: true
        attempts:
          type: integer
        finding_ref:
          type: string
          nullable: true
          description: >-
            The finding this row was armed by. The row closes only when THAT finding is resolved in every
            group it targets (R3) — never because a run finished. The close is the same rule whenever it
            becomes legal: a Writer batch may install the answer while the defect is still in front of the
            Editor (the batch is planned off an OPEN finding), and R3 refuses to close an unapproved row,
            so when the approval lands afterwards the loop's next sweep performs the close and consumes
            this row in the same commit. That is why `attempts` can legitimately read 0 on a row that was
            armed after its own fix had already been installed.
    PhraseReviewState:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          unwritten_groups,
          written_groups,
          vector,
          vector_hash,
          review_seats,
          reviews_on_current_vector,
          deep_reviews_on_current_vector,
          open_findings,
          blocking_findings,
          open_tasks
        ]
      properties:
        mode:
          type: string
          enum: [groups, sampling, classic]
          description: >-
            The SAME switch value the enclosing view reports — `groups` when this phrase's verbs are open,
            and each phrase's own off-word (`sampling` for the Summary, `classic` for Phrase ②) when they
            are not. It is echoed inside `review` because the rail reads the review block to decide what
            work exists.
        unwritten_groups:
          type: array
          items:
            type: string
          description: >-
            Catalog keys of THIS phrase's groups with no revision yet; empty means the Overview is fully
            written. A phrase with no rows has nothing to list and answers `[]`.
        written_groups:
          type: integer
        vector:
          type: object
          additionalProperties:
            type: integer
          description: '`{phrase_groups.id: revision number}` — the identity a review pass is keyed by.'
        vector_hash:
          type: string
        review_seats:
          type: integer
          description: The Critic seats the Author's dial asks for on the current text.
        reviews_on_current_vector:
          type: integer
          description: Closed structured review passes over THIS vector (counted from the run ledger, L-3).
        deep_reviews_on_current_vector:
          type: integer
          description: Closed tool-carrying deep-review passes over THIS vector (the findings' source).
        open_findings:
          type: integer
        blocking_findings:
          type: integer
          description: >-
            The open rows at §6.8's critical/major severity bar — the cost band the Reviewer weighs, not a
            gate. It is a count of SEVERITY: the Summary accept does not wait on these rows, it voids them in
            the lock commit (D-78), so nothing here says the sign-off is held.
        open_tasks:
          type: integer
        mirror:
          type: object
          additionalProperties: false
          required: [summary_id, in_sync, locked, fields]
          description: >-
            R6's compatibility mirror, READ rather than trusted: whether the legacy `summaries` prose
            still says what the groups say. `in_sync: false` with `locked: true` is the Author's own
            doing (signed prose is not rewritten under them). THE SUMMARY ONLY: the mirror is the ONE
            legacy store the Summary's groups are copied into, so on Phrase ② (or any later phrase) there
            is nothing to keep in step and this key is ABSENT — not null, not an empty object. Read it
            from `GET …/phrases` or from this contract's Summary leg.
          properties:
            summary_id:
              type: string
              nullable: true
            in_sync:
              type: boolean
            locked:
              type: boolean
            fields:
              type: array
              items:
                type: string
    PhraseImportResult:
      type: object
      additionalProperties: false
      required: [story_id, phrase_id, imported, seeded, story_switched, view]
      properties:
        story_id:
          type: string
        phrase_id:
          type: string
        imported:
          type: integer
          description: Revision rows THIS call seeded. `0` means the book already had them (idempotent).
        seeded:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group_id, revision_id, number, group_key]
            properties:
              group_id:
                type: string
              revision_id:
                type: string
              number:
                type: integer
              group_key:
                type: string
        story_switched:
          type: boolean
          description: True when this call moved the Story's `summary_mode` to `groups` (R6).
        view:
          $ref: '#/components/schemas/PhraseView'
    PhraseGroupReviseRequest:
      type: object
      additionalProperties: false
      description: >-
        ONE of `content` or `plotpoints` is the text of this revision — which one depends on the PHRASE the
        group belongs to, read off the group row, not from the body. A Summary section takes `content`
        (its prose, stored verbatim); a Phrase ② CHAPTER entry takes `plotpoints` (its contract), and its
        stored text is DERIVED from those fields by the same function the loop's install uses
        (`phrase/plotpoints.ts:chapterEntryContent`), so an Author's hand edit and a Writer's answer leave
        one text and one contract. A `content` beside `plotpoints` is therefore not read on the chapter leg,
        and a chapter body with NEITHER is 400: the install refuses a plotlines entry with no contract,
        because the `plotlines` row it mirrors would otherwise keep the PREVIOUS pass's plotpoints under text
        that has moved on (P4).
      properties:
        content:
          type: string
          minLength: 1
          description: >-
            The group's new text, verbatim. Required for a Summary section; an empty text is a refusal, not
            a revision (R2). Ignored on a chapter entry, whose text is derived from `plotpoints`.
        plotpoints:
          type: object
          additionalProperties: false
          required: [must_happen, must_change]
          description: >-
            The chapter's contract — the same six fields the `plotlines` row holds (see `Plotline`), and the
            row this install rewrites from them. Required on a chapter entry, absent on a Summary section.
          properties:
            must_happen:
              type: string
              minLength: 1
              description: What this chapter must put on the page. A blank one is a 400.
            must_change:
              type: string
              minLength: 1
              description: What leaves this chapter different. A blank one is a 400.
            heading:
              type: string
              description: The chapter's working title. Omitted or blank, the entry keeps the group's title.
            pov:
              type: string
            setups:
              type: string
            payoffs:
              type: string
        note:
          type: string
          description: Why the Author changed it — it rides onto the journal line the install writes (P11).
    StartPhraseRequest:
      type: object
      additionalProperties: false
      description: >-
        WHERE the phrase's Seed comes from. An EMPTY body, or no body at all, is `source: compiled`. The
        chosen text is COPIED onto the Phrase row and read from there ever after (D-72): editing the Seed,
        the Summary, or this contract later does not move the phrase, and the chapter plan is judged against
        what was handed over at that moment.
      properties:
        source:
          type: string
          enum: [compiled, custom]
          default: compiled
          description: >-
            `compiled` copies THIS Story's compiled Summary — a complete reviewed Overview when the crew has
            produced one, else the Overview as it stands, which is the same preference the rail's reviewed
            block reports. `custom` copies the Author's `text` instead, which is how a book starts Phrase ②
            without running Phrase ①'s pipeline.
        text:
          type: string
          description: >-
            The Author's own Seed, read ONLY when `source: custom`. It is trimmed and stored verbatim — this
            verb does not author prose on the Author's behalf — so a missing or blank `text` on that arm is
            400 rather than a phrase started on nothing. A `text` beside `source: compiled` is ignored, not
            half-applied.
    StartPhraseResult:
      type: object
      additionalProperties: false
      required: [story_id, phrase_id, key, source, seed_chars, seed_head, started, view]
      properties:
        story_id:
          type: string
        phrase_id:
          type: string
          description: The Phrase row this call created.
        key:
          type: string
          enum: [summary, plotlines]
          description: The phrase that was started, echoed so a rail cannot mistake the receipt for another phrase's.
        source:
          type: string
          enum: [compiled, custom]
          description: The arm the Seed actually came from, after the default was resolved.
        seed_chars:
          type: integer
          minimum: 1
          description: >-
            The exact length of the copied Seed. It is never 0: an empty Seed is the 409, because a phrase
            over a blank seed gets its blank text hashed by every gate as though the Author had written
            something.
        seed_head:
          type: string
          description: The leading window (at most 400 characters) of the text that was copied.
        started:
          type: boolean
          description: >-
            Always true on this response: the row exists and this call stamped it. Re-pressing the button is
            the 409 that names the phrase row, not a receipt that says `started: false`.
        view:
          $ref: '#/components/schemas/PhraseDetailView'
    PhraseGroupReviseResult:
      type: object
      additionalProperties: false
      required: [story_id, phrase_id, revision, installed, archived, mirror, view]
      properties:
        story_id:
          type: string
        phrase_id:
          type: string
        revision:
          type: integer
        installed:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group_id, group_key, revision_id, number]
            properties:
              group_id:
                type: string
              group_key:
                type: string
              revision_id:
                type: string
              number:
                type: integer
        archived:
          type: array
          description: The rows THIS install moved into history — one per written group that had a latest.
          items:
            type: object
            additionalProperties: false
            required: [group_id, group_key, revision_id, number]
            properties:
              group_id:
                type: string
              group_key:
                type: string
              revision_id:
                type: string
              number:
                type: integer
        mirror:
          type: object
          additionalProperties: false
          required: [summary_id, fields, written]
          properties:
            summary_id:
              type: string
              nullable: true
            fields:
              type: array
              items:
                type: string
            written:
              type: boolean
            reason:
              type: string
              enum: [locked, no_summary, not_summary_phrase]
              description: >-
                Why the mirror was skipped, when it was — L-7a: a locked Summary is not rewritten under
                the Author's hands. `not_summary_phrase` is the OTHER leg: an install on a chapter entry has
                no legacy `summaries` prose to mirror at all, so `written: false` there is not a refusal.
        view:
          oneOf:
            - $ref: '#/components/schemas/PhraseDetailView'
            - $ref: '#/components/schemas/PhraseView'
          description: >-
            THE PHRASE THE GROUP BELONGS TO, read fresh after the write: a Summary section's verb answers the
            `PhraseView` shape, and a Phrase ② chapter entry's answers the `PhraseDetailView` shape (that
            shape plus `key`, `seed_head`, `seed_chars`, `brief`). `key` is what tells them apart, and both
            are listed because the Summary's read always carries `review.mirror`, which the wider shape
            makes optional.
    PhraseGroupLockActor:
      type: string
      enum: [author, editor]
      description: >-
        Who put a group into the locked state (R-lock). The AUTHOR owns the lock outright and is the only
        actor that may lift it, whoever set it. The EDITOR may lock only on a Story that turns
        `editor_group_locking` on, and only through its own judgement seat — the Author-facing routes in
        this contract always act as `author`, because a dashboard verb cannot report an Editor lock it did
        not take, and an Editor unlock is refused outright (`editor_unlock`) rather than offered here.
    PhraseGroupVoidedFinding:
      type: object
      additionalProperties: false
      required: [finding_id, previous_state, scope]
      description: >-
        One claim the LOCK retired, in the shape the lock report returns it. A finding is retired only when
        EVERY group it names is now locked — the effective scope is the read that decides it
        (`findingGroupScope`, which treats an UNSCOPED finding as naming the whole Overview, so a
        whole-Overview claim goes void exactly when the last group locks and not earlier). A claim that
        also names an unlocked group stays open and stays work, for those groups only.
      properties:
        finding_id:
          type: string
          description: The finding that stopped being work.
        previous_state:
          type: string
          enum: [unconfirmed, confirmed, approved, disputed]
          description: >-
            The state the row held before the lock moved it to `discarded`. Only these four can appear:
            `fixed` and `discarded` are terminal and are never rewritten. A `disputed` row IS voidable
            here, because this is the lock's own retire set (`phrase/locks.ts:VOIDABLE_FINDING_STATES`)
            and not the issues-first holding set (`loop/types.ts:ISSUE_HOLDING_STATES`, which `disputed`
            left on 2026-11-25): a lock retires a live claim about text that just stopped being
            writable, while the flow itself no longer waits on that claim.
        scope:
          type: array
          items:
            type: string
          description: >-
            The group ids the claim names — the whole scope that just became un-writable, in the order the
            scope read them. This is what lets the rail say WHY the row closed instead of leaving a
            finding that quietly stopped being work.
    PhraseGroupLockResult:
      type: object
      additionalProperties: false
      required:
        [
          story_id,
          group_id,
          locked,
          locked_revision,
          locked_by,
          locked_at,
          voided_findings,
          view,
        ]
      description: >-
        What a lock did (R-lock). The lock writes ONE row — the group's four lock fields — plus the
        findings that lost their last writable group; nothing else moves, because the judgement is a flag,
        not an edit.
      properties:
        story_id:
          type: string
        phrase_id:
          type: string
          description: >-
            The Summary Phrase the group composes into, omitted exactly as on the revise and choose
            results: a book that has no Phrase row yet sends no key rather than a null one.
        group_id:
          type: string
          description: The group that is now locked (the path's `phrase_groups.id`, echoed).
        locked:
          type: boolean
          description: Always true on a successful lock — the flag the verb exists to set.
        locked_revision:
          type: integer
          description: >-
            The revision the lock fixed. The seat that judges a lock is armed on a CLEAN revision and
            re-checks it at settlement, so this number names the exact text the judgement was made about.
        locked_by:
          $ref: '#/components/schemas/PhraseGroupLockActor'
        locked_at:
          type: string
          format: date-time
          description: >-
            The lock commit's own stamp, in UTC: ISO-8601 with millisecond precision and a `Z` offset
            (e.g. `2026-11-25T09:00:00.000Z` — `server/tools/utilities.ts:nowIso`, which is what both the
            lock route and the Editor seat's settle write). There is no clock for the seat's decision of
            its own: this is the moment the flag landed, which is what the audit reads.
        voided_findings:
          type: array
          items:
            $ref: '#/components/schemas/PhraseGroupVoidedFinding'
          description: >-
            The claims the lock retired, empty when none had their whole scope inside the group. Reported
            because the lock just shortened the Author's queue, and silence there reads as a bug rather
            than as a decision.
        view:
          oneOf:
            - $ref: '#/components/schemas/PhraseDetailView'
            - $ref: '#/components/schemas/PhraseView'
          description: >-
            The fresh phrase read, so the rail's lock badge moves with the write rather than with a later
            poll (the revise route's envelope, R2/D-68) — and it is the read of the phrase the GROUP belongs
            to: `PhraseView` for a Summary section, `PhraseDetailView` for a Phrase ② chapter entry.
    PhraseGroupUnlockResult:
      type: object
      additionalProperties: false
      required: [story_id, group_id, locked, locked_revision, locked_by, locked_at, view]
      description: >-
        What an unlock did (R-lock): the flag is off and NOTHING else is rewritten. It does not touch
        `content` or `revision`, writes no revision row, and does not resurrect the findings the lock
        retired — `discarded` is terminal, and a defect the crew still believes in is filed again by the
        next Critic pass against the now-writable text.
      properties:
        story_id:
          type: string
        phrase_id:
          type: string
          description: Omitted on a book with no Phrase row, exactly as on the lock result.
        group_id:
          type: string
          description: The group whose lock came off.
        locked:
          type: boolean
          description: Always false — the group is writable again and the loop may offer it again.
        locked_revision:
          type: integer
          nullable: true
          description: >-
            `null`, not absent: the response states the state the route LEFT the row in, and the row itself
            clears the field to null (a store patch merges through JSON and cannot delete a key). The
            PROJECTION, which reports what the book looks like rather than what a verb did, drops the key
            entirely while the group is unlocked.
        locked_by:
          type: string
          nullable: true
          description: Always null after a successful unlock.
        locked_at:
          type: string
          nullable: true
          description: >-
            Always null: an unlock mints no timestamp of its own. The journal line the write makes is the
            record of when the flag came off.
        view:
          oneOf:
            - $ref: '#/components/schemas/PhraseDetailView'
            - $ref: '#/components/schemas/PhraseView'
          description: >-
            The fresh phrase read, with the group's lock keys gone — the read of the phrase the GROUP
            belongs to (`PhraseView` for a Summary section, `PhraseDetailView` for a chapter entry).
    PhraseReviewedChooseRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          description: >-
            Why the Author took THIS reviewed Overview. It rides onto every journal line the choose
            writes — the five installs, each discard, and the Phrase row's choice record (P11) — so the
            book can say later what the decision was, not only what it was.
    PhraseReviewedChooseResult:
      type: object
      additionalProperties: false
      required: [story_id, phrase_id, revision, vector, vector_hash, at, overview, installed, discarded, sources, mirror, view]
      properties:
        story_id:
          type: string
        phrase_id:
          type: string
        revision:
          type: integer
          description: >-
            The phrase row's revision number after the choose's install (R2 — one install, one bump).
        vector:
          type: object
          additionalProperties:
            type: integer
          description: '`{group_id: revision_number}` — the vector that was chosen (the selected rows, not the new ones).'
        vector_hash:
          type: string
          description: >-
            The chosen vector's hash — the key the Reader's score rows carry, so the rail can show the
            number the choice was made under beside the choice itself.
        at:
          type: string
        overview:
          type: string
          description: The reviewed Overview that was chosen, composed from the rows the vector names.
        installed:
          type: array
          description: >-
            The five NEW `latest` rows, one per group, holding the chosen text (catalog order). The
            choose installs rather than adopting in place because §4.19/R2 pins a group's line as
            "created in order, the highest number is `latest`" — adopting r4 under a discarded r5 would
            break that and let the next install mint number 5 a second time.
          items:
            type: object
            additionalProperties: false
            required: [group_id, group_key, revision_id, number]
            properties:
              group_id:
                type: string
              group_key:
                type: string
              revision_id:
                type: string
              number:
                type: integer
        discarded:
          type: array
          description: >-
            Every revision row this choose flipped to `discarded`, in group-then-number order. Retained,
            terminal, and hidden from the group rows' `history` — the Author's rail lists them as what
            was passed over, and R3's join still reads them, so a `fixed` finding stays fixed.
          items:
            type: object
            additionalProperties: false
            required: [group_id, group_key, revision_id, number]
            properties:
              group_id:
                type: string
              group_key:
                type: string
              revision_id:
                type: string
              number:
                type: integer
        sources:
          type: array
          description: Where each chosen text came from — the selected row and the row that now holds it.
          items:
            type: object
            additionalProperties: false
            required: [group_id, group_key, source_revision, source_id, installed_revision]
            properties:
              group_id:
                type: string
              group_key:
                type: string
              source_revision:
                type: integer
              source_id:
                type: string
              installed_revision:
                type: integer
        mirror:
          type: object
          additionalProperties: false
          required: [summary_id, fields, written]
          properties:
            summary_id:
              type: string
              nullable: true
            fields:
              type: array
              items:
                type: string
            written:
              type: boolean
            reason:
              type: string
              enum: [locked, no_summary]
              description: >-
                Why the legacy mirror was skipped, when it was — L-7a: a locked Summary is not rewritten
                under the Author's hands, and a choose is no exception.
        view:
          $ref: '#/components/schemas/PhraseView'
    PatchStoryRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        idea:
          type: string
          minLength: 1
        chapter_count:
          type: integer
          minimum: 1
        auto_approve:
          type: array
          items:
            $ref: '#/components/schemas/Cost'
        editor_group_locking:
          type: boolean
          description: >-
            R-lock — grant or revoke the Editor's power to lock a Summary group. A strict BOOLEAN: `false`
            is a WRITE that turns the permission off, and an OMITTED key changes nothing (the Setting is
            read as `=== true`, so a string `"false"` or a `0` would otherwise store a value the domain
            reads as ON — the route refuses them with that sentence). Turning it off never lifts a lock
            that already stands: locks are lifted by `POST …/phrases/groups/{groupId}/unlock`, by the
            Author alone.
        plotlines_mode:
          type: string
          enum: [groups, classic]
          description: >-
            R11 / P4 — move Phrase ② between the chapter-entry pipeline (`groups`) and the classic plotline
            tools (`classic`). THE DIAL IS MOVABLE ONLY WHILE THE PHRASE IS UNSTARTED: starting it is the
            moment its copied seed, its entries and its claim keys come into being, and switching lanes
            afterwards would leave a started phrase whose entries are written by a pipeline nobody chose, so
            the 409 names the Phrase row that made the dial unmovable. An OMITTED key changes nothing — and
            remember that a book written before Phrase ② carries no `plotlines_mode` at all, which reads as
            `classic` (R6 applied to this dial: an absent field is the old pipeline, never a silently-open phrase). `summary_mode`
            is a separate Setting on a separate phase, and this PATCH never touches it.
    BacktrackRequest:
      type: object
      required: [phase]
      additionalProperties: false
      properties:
        phase:
          type: string
          enum: [summary, plotlines]
    WhyRequest:
      type: object
      required: [why]
      additionalProperties: false
      properties:
        why:
          type: string
          minLength: 1
          description: The audit sentence an approval or discard must carry (D-8/T-5).
    NoteRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          description: >-
            The Author's note. On an Idea selection it is the explicit acknowledgement when a
            sourced Idea has no `verified` Editor verdict; on a revision selection it lands in
            `selection_note` and defaults to the server's own sentence when absent or blank.
    SectionContentRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          description: The complete section text (not a patch); an empty string is a valid paragraph-free section.
    RevisionMergeRequest:
      type: object
      required: [unit_ref, revision_ids, parts]
      additionalProperties: false
      properties:
        unit_ref:
          type: string
        revision_ids:
          type: array
          minItems: 2
          items:
            type: string
        parts:
          type: string
          description: The merge brief - which half of which draft to take.
        why:
          type: string
          description: Optional audit sentence; the server writes its own when absent.
    UndoRequest:
      type: object
      required: [chapter_id, section_id]
      additionalProperties: false
      properties:
        chapter_id:
          type: string
        section_id:
          type: string
    DirectiveRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
        refs:
          type: array
          items:
            type: string
          description: Artifact ids naming the pane the Author is looking at.
    TemplateAssignRequest:
      type: object
      required: [template_ids]
      additionalProperties: false
      properties:
        template_ids:
          type: array
          items:
            type: string
    ChapterBarRequest:
      type: object
      required: [bar_override]
      additionalProperties: false
      properties:
        bar_override:
          type: string
          description: 'Whitespace-separated tokens such as `-C-7 +1`; an empty string clears the override.'
    GoalCriterionOp:
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [add, remove, setHard]
        id:
          type: string
        criterion:
          $ref: '#/components/schemas/Criterion'
        hard:
          type: boolean
    GoalUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        threshold_soft:
          type: number
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/GoalCriterionOp'
    AssistantRequest:
      type: object
      required: [target, text]
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [summary, directive]
        text:
          type: string
          minLength: 1
    AgentModelUpdateRequest:
      type: object
      required: [model]
      additionalProperties: false
      properties:
        model:
          type: string
          nullable: true
          description: A non-empty provider model id, or `null` to clear the roster choice.
    CreateTemplateRequest:
      type: object
      description: >-
        One of `template` (New) or `duplicate_of` (Duplicate) is required; when both are present
        the route duplicates the named row. An Author template is always created as
        `builtin: false, editable: true`.
      additionalProperties: false
      properties:
        template:
          $ref: '#/components/schemas/Template'
        duplicate_of:
          type: string
    TemplateUpdateRequest:
      type: object
      description: A partial template; omitted fields keep their stored value.
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TemplateRole'
        serves_phase:
          type: array
          items:
            $ref: '#/components/schemas/StoryPhase'
        done_definition:
          type: string
        selection_rules:
          type: string
        attempts:
          type: integer
        delegation:
          type: array
          items:
            type: string
        escalation_rule:
          type: string
        next_phase:
          type: string
        max_concurrent:
          type: integer
        builtin:
          type: boolean
        editable:
          type: boolean
