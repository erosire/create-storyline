    PhaseLockReceipt:
      type: object
      description: >-
        T12 — what ONE lock commit did, as the `/lock` response's `lock_receipt`. The accept of a final
        Summary stops live work on the Author's behalf, and L-25b's rule for that is "whatever is still open
        at that moment is discarded by the act of completing, and the count is recorded and shown": these
        counts are the recorded half, and the rail's sentence under the button is the shown half.
        The three `phrase_*`/leftover fields are ABSENT on a `plotlines` or `chapters` lock — that leg voids
        no finding, closes no task and starts no phrase, and a zero there would report a decision the Author
        never took. `phrase_started: false` on the summary leg is a successful NO-OP with its reason beside
        it (already started, nothing compiled to copy, or the classic lane), never a failed lock.
      required:
        - phase
        - deleted_ideas
        - next_phase
      additionalProperties: false
      properties:
        phase:
          $ref: '#/components/schemas/StoryPhase'
        deleted_ideas:
          type: integer
