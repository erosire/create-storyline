        seed_brief:
          allOf:
            - $ref: '#/components/schemas/SeedBriefView'
          nullable: true
          description: >-
            §10/§3.3 — the ACCEPTED Seed Brief, trimmed to the reading surface. Null before phase ①'s
            gate 1 (no accepted brief yet). Additive: a client that predates it simply ignores it.
        sampling:
          $ref: '#/components/schemas/SamplingView'
        plotlines_mode:
          type: string
          enum: [groups, classic]
          description: >-
            T-W3, ADDITIVE — Phrase ②'s dial, ECHOED from the row rather than derived, and with the phrase's
            own off-word: a book whose row carries no `plotlines_mode` is a classic book (R6 applied to this dial — an absent
            Setting is the pipeline it has always run, never a silently-open phrase). The chapter rail reads
            this to decide whether a chapter entry is the writable surface or the classic §4.3 tool path is,
            and P4 requires the rail's disabled button and the verb's 409 to agree on exactly this value.
            The raw record carries the same value under `story.plotlines_mode`.
        phrase_started:
          type: object
          additionalProperties: false
          required: [summary, plotlines]
          description: >-
            T-W3, ADDITIVE — which phrases have been STARTED on this book, as the rail's two rows. A Phrase
            row IS the record of a start (`phrase/controllers/plotlines.ts` copies the seed as it mints the
            row), so this is a read of rows and not of a counter: `plotlines: false` is precisely the state
            the handoff button exists to leave, and it is the state in which `plotlines_mode` may still move.
            A phrase added to the catalog later is one more key here; nothing renumbers the two.
          properties:
            summary:
              type: boolean
              description: >-
                Phrase ① — true on essentially every Story, because story creation mints the Summary row with
                the catalog (R1). A false here is a book older than the catalog, which is what the import
                verb is for.
            plotlines:
              type: boolean
              description: >-
                Phrase ② — true once the Author has started it from a Seed, whether or not the chapter
                entries exist yet (a started phrase with no entries is a phrase whose brief has not been
                accepted, and the rail shows that as the `brief` block rather than as `false` here).
        summary_compiled:
          type: boolean
          description: >-
            T-W3, ADDITIVE — THE HANDOFF BUTTON'S ENABLE CONDITION: is there a Summary text to copy into
            Phrase ② right now? True on a complete reviewed Overview (the text the crew stands behind) or on
            any non-empty composed Overview, in that preference and by the same read the reviewed block
            reports (`api/projections.ts:summaryIsCompiled`). This is deliberately the WEAKER question —
            "is there text", not "is Phrase ① finished" — because the Start verb's 409 on an empty compiled
            Summary is the server's answer to the same question, and a rail that greyed the button off a
            second, stricter rule would contradict the desk's own copy of `phrase_started`.
    SeedBriefView:
      type: object
      description: >-
        §3.3 — the Editor's derived, machine-readable projection of the Author's Seed, trimmed to what
        the Story view renders. The Seed itself stays `stories.idea` and is never edited (P5); the
        arrays and tone hints belong to the prompt compiler.
      required: [id, seed_hash, logline, protagonist, want, obstacle, stakes, setting, promise, status]
      additionalProperties: false
      properties:
        id:
          type: string
        seed_hash:
          type: string
        logline:
          type: string
        protagonist:
          type: string
        want:
          type: string
        obstacle:
          type: string
        stakes:
          type: string
        setting:
          type: string
        promise:
          type: string
        status:
          $ref: '#/components/schemas/SeedBriefState'
    SamplingSample:
      type: object
      description: >-
        One sample's screening tally, as the selector ranked it (§6.5). This is the WINNER'S surface:
        `sampling.selected` carries only the counts that installed the draft. The hill's per-candidate
        fields (`outcome`, the origin split, the minimality counts) live on the HISTORY line instead —
        that is where they have to survive the selection commit's hard truncate (§6.6/P13), and this
        projection reads them off the kept row rather than duplicating them here
        (`api/projections.ts:samplingView`).
      required: [revision_id, critical, high]
      additionalProperties: false
      properties:
        revision_id:
          type: string
        critical:
          type: integer
          description: >-
            Screening issues at severity `critical` across every screening review of this draft
            (`sample-select.ts:ScoredSample.critical`).
        high:
          type: integer
          description: >-
            Screening issues at severity `high`. `high` IS a finding at cost `major`
            (`shared/types.ts:SampledIssue` maps the two one-to-one), so `critical` + `high` is THE
            blocking pair everywhere in this contract — in the screening answer, in the selection
            gates, and in the Author's escalation.
    SamplingHistorySample:
      type: object
      description: >-
        One sample of a completed round — its tally, whether its screening list validated, and the half
        of the record that ONLY this line carries. The selection commit hard-deletes every losing draft
        AND its `sample_reviews` rows (§6.6/P13/D-22), so the outcome, the reason and the outstanding
        fixes exist nowhere else afterwards.
      required: [revision_id, critical, high, valid, unresolved_fixes]
      additionalProperties: false
      properties:
        revision_id:
          type: string
        critical:
          type: integer
          description: Screening issues at `critical` across every screening review of this draft.
        high:
          type: integer
          description: Screening issues at `high` (a finding at cost `major`).
        valid:
          type: boolean
          description: >-
            False when no screening review of this draft can carry a verdict at all — every screening
            attempt failed the output schema, or every row persisted invalid. An invalid candidate is
            never the winner; it is a rejection, and the reason is the `reject_reason` line.
        unresolved_fixes:
          type: array
          description: >-
            The STILL-OPEN fix task ids this candidate did not clear — its blocking screening issues
            plus the demanded fixes a Critic marked `unresolved`/`unknown` or never answered. Present on
            EVERY line, including the winner's and including a row written before the field existed
            (normalised to `[]`, `api/projections.ts:samplingView`), so a consumer reads one shape and
            never branches on which build wrote the row. `[]` means "this candidate owed nothing, or
            cleared everything it owed"; the demand as it stood at the SELECTION, so a task the Author
            settled first reads `[]` too.
          items:
            type: string
        outcome:
          type: string
          description: >-
            What became of this candidate in the round. ABSENT only on a row written before the hill —
            inventing `rejected` there would state a judgement the book never recorded.
          enum:
            - accepted # the draft this commit installed — the row's `selected` id
            - eligible # it cleared every gate and ranked below the winner (a smaller change won)
            - rejected # it was never selectable, for the reason in `reject_reason`
        reject_reason:
          type: string
          description: >-
            Why a `rejected` candidate was refused, in one clause the Author can act on — each is the
            literal string `loop/sample-select.ts` pushes (e.g. `fix task_1 not certified with evidence`,
            `introduced 1 critical / 0 major the accepted draft did not have`, `the screening leg
            answered nothing an auditor could read`). Derived from the recorded counts, never from a
            model (P6). Absent on an `accepted`/`eligible` line, which owed no explanation.
        introduced_critical:
          type: integer
          description: >-
            Blocking `critical` issues this candidate CREATED — defects the accepted draft it replaces
            did not carry. Any of them makes the candidate ineligible. Sent only in a refinement round
            (a first round has no incumbent to regress against), and an issue whose origin no screening
            pass stated counts HERE, not in `inherited_*` — fail closed: a pass handed the base and
            silent about the origin cannot swear the draft is no worse than the text it replaces.
        introduced_high:
          type: integer
          description: The same split at `high` (a finding at cost `major`).
        inherited_critical:
          type: integer
          description: >-
            Blocking `critical` issues the ACCEPTED draft already had and this candidate still carries.
            They cost the candidate nothing on their own — Revision N was accepted with them, and the
            Author decides which become work — so "inherited" means "not a regression", never "excused":
            one inherited defect the Author DID targeted is an open fix task in the candidate's demand.
            Sent only in a refinement round.
        inherited_high:
          type: integer
          description: The same split at `high`.
        changed_fields:
          type: integer
          description: >-
            Minimality: how many of the six §4.2 prose fields (`premise`, `promise`, `theme`, `tone`,
            `ending`, `world_rules`) this candidate changed against the accepted draft. THE TIE-BREAK,
            not a quality score (P6): among candidates that cleared the same certified work the loop
            takes the smallest edit. Absent in a first round, where there is no accepted text to be
            minimal about.
        changed_characters:
          type: integer
          description: >-
            The size of those changes in characters — what the accepted draft loses PLUS what it gains,
            per changed field, measured as the smallest span that explains each change (common prefix
            and suffix stripped). The last measurement key before creation order.
    SamplingHistoryRow:
      type: object
      description: >-
        §3.6/§6.6 — one completed sampling round's P11 audit line. The losing samples are hard-deleted
        by the selection commit, so this row is the surviving record of what competed — and the hill's
        ledger (which WAVE ran, what it spent, what it proved) survives only here.
      required: [round, at, samples, selected]
      additionalProperties: false
      properties:
        round:
          type: integer
        at:
          type: string
          format: date-time
          description: When the selection commit wrote this line (ISO-8601).
        samples:
          type: array
          description: >-
            EVERY attempt the round made — the drafts it came with AND the ones the retry allowance
            bought — in creation order, including the ungradeable and rejected ones the commit deleted.
          items:
            $ref: '#/components/schemas/SamplingHistorySample'
        selected:
          type: string
          description: The revision this commit installed; it is the sample line whose `outcome` is `accepted`.
        wave:
          type: integer
          description: >-
            The SAMPLING WAVE these attempts belong to (`stories.sampling_wave`, D-34's arm/disarm
            counter). Attempts, improvements and the no-progress streak are scoped to a wave, not to a
            round, so two lines for the same round — one at wave 0, one at wave 1 — are a stall and the
            restart after the Author cleared the escalation. That is the difference between "the hill
            stalled again" and "the hill moved", and it is why the pane needs the number. Absent only on
            a row written before the hill.
        attempts:
          type: integer
          description: >-
            The wave's attempt count AT THE MOMENT this install happened — the same number the
            escalation and the work queue derive from the ledger, so the three can never disagree and a
            restart cannot re-buy attempts that were already spent.
        improvements:
          type: integer
          description: How many times this wave measured a STRICTLY LOWER unresolved-blocking count than its own best so far. Each one buys one attempt beyond the static cap.
        ceiling:
          type: integer
          description: >-
            The attempt ceiling this wave was allowed — the Author's `summary_sampling` PLUS the
            sampling retry allowance PLUS one per measured improvement. `attempts >= ceiling` is what
            the work queue reads as "buy nothing more".
        unresolved_blocking:
          type: integer
          description: >-
            The unresolved-blocking count of the draft this install put in — THE BAR the next candidate
            has to beat, since only a strictly lower count counts as an improvement. `0` when the wave
            demanded no fixes at all.
    SamplingView:
      type: object
      description: >-
        §10/§6.5-§6.6 — phase ①'s sampling state: the last COMPLETED round, the round IN FLIGHT, the
        sample the last selection installed (with the counts that won it), and the bounded audit
        history.
      required: [round, active_round, history]
      additionalProperties: false
      properties:
        round:
          type: integer
          description: >-
            Last COMPLETED round — `sampling_round ?? 1`, exactly `loop/records.ts:deepReviewRoundOf`.
            It is the round the deep review is dispatched for and the number §10's pane prints, and it is
            `0` on a Story whose counter an Author reset (a Seed edit or a backtrack to `summary` zeroes
            it, so the reopened phase samples round 1 again); the projection reports the stored 0 as-is.
        active_round:
          type: integer
          description: >-
            The round the loop is WORKING — `(sampling_round ?? 0) + 1`, the loop's own read
            (`loop/records.ts:samplingRoundOf`), which is also what decides whether a `drafted` Summary
            row is live work or a loser the loop set aside
            (`loop/records.ts:isSupersededSummaryDraft`). It travels because `round` ALONE IS AMBIGUOUS
            at the boundary that matters: a Story that has never selected and a Story whose round 1 just
            closed both say `round: 1`. The client is forbidden from recomputing the +1.
        selected:
          $ref: '#/components/schemas/SamplingSample'
        history:
          type: array
          description: The Story's sampling_history rows, capped at the last five, newest first.
          items:
            $ref: '#/components/schemas/SamplingHistoryRow'
    QueueItem:
      type: object
      description: One decision on the cross-Story Author queue.
      required: [kind, story_id, story_title, id, title, evidence, created_at]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/QueueItemKind'
        story_id:
          type: string
        story_title:
          type: string
        id:
          type: string
        title:
          type: string
        finding_kind:
          type: string
          enum: [issue, proposal]
          description: >-
            D-33b — the CLAIM TYPE of the finding, present on `kind: finding` rows and on no others
            (`api/projections.ts:queueItems` emits it with every finding row). It carries a different
            name because this row's own `kind` is already the queue discriminator; the finding's kind
            would otherwise be shadowed by it. `issue` claims a defect the artifact must answer by
            quotation; `proposal` is a proposal the Seed never promised, which the Editor weighs on
            merit and never disputes for resting on an absence. A row raised before the field existed is
            reported as `issue`, so the desk reads one shape for both eras of row.
        detail:
          type: string
        evidence:
          type: string
        cost:
          $ref: '#/components/schemas/Cost'
        created_at:
          type: string
    StoryKnowledgeEntry:
      type: object
      required: [key, title, body, tags]
      additionalProperties: false
      properties:
        key:
