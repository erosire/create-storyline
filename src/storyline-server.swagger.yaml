  /v1/storyline/stories/{id}/lock:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    post:
      tags: [Stories]
      operationId: lockStoryPhase
      summary: Lock the Story's current phase — for phase ①, this is "Accept final Summary"
      description: >-
        U-16's sign-off. The engine's own 409 is the product copy when the Ideas tray is not
        empty (L-7a); this route additionally refuses a phase whose Goal does not pass, naming
        the failing criteria (U-16). On success the phase's artifacts become read-only and the
        Story advances. The route takes no body.
        ACCEPTING THE FINAL SUMMARY (phase ①, L-30/P5). The button means "this clean Summary is the
        Summary", and the accept completes the phrase in ONE commit: the Story's `summary_locked` and the
        Summary's `locked` flags go on, the phase's Ideas tray is emptied (D-36 — the tray is the only thing
        a lock DELETES), every finding still OPEN ON THE SUMMARY PHRASE is voided to `discarded` through the
        same void path a group lock uses (its row survives as provenance, P11; `fixed` and `discarded` rows
        are terminal and untouched), and every task still in the queue moves to `wontfix`. Scope is the
        PHRASE being completed, not the Story: a claim naming a Plotlines entry — alone or alongside a
        Summary group — stays open, because that is the text the next phrase is about to write. Nothing here
        is a gate: findings and tasks never blocked the accept, and they still do not (L-25b — "completion
        does not require an empty findings list"); what the act does is STOP the leftovers and RECORD the
        counts, which is what `lock_receipt` is for.
        PHRASE ② THEN STARTS ITSELF (R4), in a SECOND commit after the lock: the Plotlines Phrase is created
        from the COMPILED Summary — the bytes `projections.ts:compiledSummaryOf` composes (the complete
        reviewed Overview when the crew produced one, the composed Overview otherwise), which is what the
        rail's handoff button reads — exactly as `POST …/phrases/plotlines/start` with `source: compiled`
        would. It is idempotent (an
        already-started Phrase ② is left exactly as it is, its copied seed included), it is skipped on a
        Story whose `plotlines_mode` is not `'groups'` (that lane has no Phrase ② row), and a start that
        cannot happen NEVER undoes the lock and NEVER answers 409: the response stays 200 with the lock
        committed, and the reason rides in the receipt. A `plotlines` or `chapters` lock starts nothing and
        reports nothing about Phrase ②.
        THE RESPONSE is the Story row plus ONE additive key, `lock_receipt` (see `PhaseLockReceipt`): the
        row the pinned client already reads is byte-stable, and the accept's accounting is a new object
        beside it. `voided_findings`, `wontfixed_tasks` and the two `phrase_*` fields appear on the SUMMARY
        leg only — absent means that leg wrote no such rows.
      responses:
        '200':
          description: The Story row, plus `lock_receipt` — the tray, findings and tasks the lock stopped, and whether Phrase ② started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StoryRow'
                  - type: object
                    properties:
                      lock_receipt:
                        $ref: '#/components/schemas/PhaseLockReceipt'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
