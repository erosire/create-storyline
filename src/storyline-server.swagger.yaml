          type: string
          enum: [research, summary, plotlines, chapters, cast, continuity, goal, ideas, findings]
        title:
          type: string
        article_id:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/StoryKnowledgeEntry'
    StoryKnowledgeTree:
      type: object
