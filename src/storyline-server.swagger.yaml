# ---------------------------------------------------------------------------
# Storyline - REST + SSE contract
#
# Codegrounded sources this document is read off (it describes the build, not a wish):
#   src/server/api/routes.ts        - route table, body validation, error mapping, SSE feed
#   src/server/api/projections.ts   - StoryRow / StoryView / GoalSurface / QueueItem projections
#   src/server/api/server.ts        - mount root `/v1/storyline`, provider triple, static UI
#   src/server/run/story-engine.ts  - agent roster projection, retained thread shape
#   src/server/knowledge/*          - the Story knowledge directory projection
#   src/shared/types.ts             - the normative §4 record shapes and enums
#
# WHAT THIS API IS. A local, operator-facing control plane for Storyline: the book (stories,
# summaries, plotlines, chapters, cast, ledger, goals, findings, ideas, proposals, revisions,
# runs, directives, tasks, digests) plus the loop that works on it. The SERVER owns every
# durable record and every computed projection. The dashboard is a CLIENT: it renders what
# these routes answer and mutates only through them. It holds no authoritative copy of a row,
# never writes the book itself, and never derives a level, pass/fail string, queue decision,
# or lock gate. One browser application is bundled beside this server, but it is not a second
# backend - `src/dashboard/api.ts` is its whole interaction surface.
#
# MOUNT AND TRANSPORT. Every route below is mounted under `/v1/storyline`. REST reads answer
# JSON. `GET /v1/storyline/stream` is a Server-Sent Events feed of the Store's commit groups;
# it is a HINT, not a payload: a frame names what changed and the client re-reads the resource
# from the authoritative route (P1/P3: the store is the memory). A dropped frame is harmless.
#
# ERROR SHAPE. Every non-2xx answer is `{ "error": string }`. The sentence is product copy, not
# a log line: the dashboard re-throws it verbatim so the Author reads which rule refused the
# write (L-13). The status classes are:
#   * 400 - the body is missing a field, has the wrong type, or names a value outside the route's
#           accepted set;
#   * 404 - a path id the server does not hold (checked before any engine call);
#   * 409 - every refusal the loop raises, including a stale compare-and-swap write and a
#           lifecycle gate such as "pause the Story before editing prose" (D-37);
#   * 502 - the provider whose model catalogue `GET /agents/models` proxies did not answer.
#
# WRITE RETURNS. Author-facing writes answer with the projection the dashboard re-renders:
# a Story mutation answers the refreshed `StoryRow`; a Goal write answers the refreshed
# `GoalSurface`; a template write answers the `Template`; a kill answers the `Run`. The route
# never returns the raw journal and never asks the client to infer a side effect.
#
# ENDPOINT GRAMMAR. Collection paths are nouns (`/stories`, `/agents`, `/templates`, `/runs`,
# `/queue`). A Story-scoped verb is a `POST` beneath the Story that owns it
# (`/stories/{id}/lock`, `/stories/{id}/findings/{findingId}/approve`). Field edits on a record
# are `PATCH` (`/stories/{id}`, `/stories/{id}/goal`, `/stories/{id}/chapters/{chapterId}/bar`,
# `/templates/{templateId}`). Deletion is `DELETE /stories/{id}`. There is no second spelling
# of a mutation and no client-side state-changing shortcut.
# ONE WORKSPACE, MANY BOOKS (S-RUNTIME). A Story is a book: `<root>/stories/<uuid>/` holds its
# `store.json`, its `journal.jsonl`, and its own `harness/` (knowledge articles and the retained
# thread log). `<root>/server/` is the app book: the crew catalogue and the host settings (the fan-out
# ceiling, the roster's model choices) — no Story rows, and no Story journal of its own. Two
# consequences the contract shows:
#
#   * A COLLECTION id is local to one book. `run_0`, `finding_3` and `thread_9` are not unique across
#     the workspace, which is why every aggregate row carries `story_id` and why a follow-up verb is
#     addressed through the Story that owns it (`/stories/{id}/findings/{findingId}/approve`). The
#     Story ids themselves are uuids and are unique across the workspace.
#   * An AGGREGATE route (`/stories`, `/queue`, `/runs`, `/agents`, `/agents/{kind}/threads`) answers
#     the union of the books' own correct answers, in a Story-keyed order — it never merges two
#     Stories' same-named records into one row, and never re-derives a projection over a combined row
#     set. `/stream` fans every book, including a Story created after the client connected.
#
# The three CONFIGURATION writes (`POST/PATCH /templates`, `PATCH /agents/{kind}`, `PATCH /loop`)
# write host configuration in the app book, and the server then mirrors it into every open Story's
# book, because that copy is what a Story's crew and roster actually read. They answer the same shape
# as before; a built-in crew card stays read-only (409, D-17).
openapi: 3.0.3
info:
  title: Storyline API
  version: 1.0.0
  description: >-
    THE CONTRACT THE STORYLINE SERVER IMPLEMENTS, mounted at `/v1/storyline`. Every read the
    workstation renders and every write it performs is one of these operations. The browser
    application is a renderer and an operator surface; the server owns the Story records, the
    event journal, the run execution, the criteria engine, the digest, and the knowledge
    directory. A client never gets a second copy of the book and never recomputes a server
    projection.

    THE STORY LOOP. A Story starts from an Author-written Seed. The loop dispatches the
    assigned harness templates at the Story's current phase, records every run, every finding,
    every Idea, every draft and every directive, and stops only at the decisions §4/§10 reserve
    for the Author: a phase sign-off, an Idea selection, a finding approval, a completion
    acceptance, or a stall. The route table exposes those decisions as explicit verbs, so the
    UI cannot accidentally take one by editing a record.

    THE EMPLOYEES. Writer, Editor, Critic and Reader are global standing identities. They are
    NOT agents until a thread executes under one; `GET /agents` is the roster and
    `GET /agents/{kind}/threads` is the retained history the tile opens. `PATCH /agents/{kind}`
    is the single roster write, and it changes only the model that kind asks for.

    THE STREAM. `GET /stream` is a Server-Sent Events feed. A frame is an event name plus the
    affected Story id (empty for a workspace-wide change). The client refetches the resource it
    is showing; it never trusts a pushed body. A proxy that buffers the stream degrades to a
    bounded poll, which is a real, slower mode rather than a silent freeze.

    THE UI BOUNDARY. The shipped dashboard talks to exactly this origin at exactly this mount.
    It may import the shared data-model types for compile-time shape checking, but it may not
    import a server module, call the provider, open a harness socket, or execute a harness tool
    directly. The one exception is the test suite, which boots the real server to verify that
    the UI renders the wire; production code has one network layer, `src/dashboard/api.ts`.
servers:
  - url: http://127.0.0.1:5000
    description: Storyline host, canonical mount `/v1/storyline`
tags:
  - name: Stories
    description: The Stories panel, the Story view, and the Story-level controls.
  - name: Knowledge
    description: The durable per-Story knowledge directory projection.
  - name: Findings
    description: The Author's approval / discard decisions on a finding.
  - name: Ideas
    description: The Author's select / discard / defer decisions on an Idea.
  - name: Prose
    description: Section edits, undo, chapter locks, and per-chapter Goal overrides.
  - name: Revisions
    description: Competing drafts, the Author's selection, and merge requests.
  - name: Proposals
    description: The propose-only channel an agent uses to ask the Author for an edit.
  - name: Directives
    description: The directive bar's one-line channel to the Editor.
  - name: Goal
    description: The Goal panel's threshold and criterion edits.
  - name: Assistant
    description: The Author-invoked §8.6 assistant run.
  - name: Agents
    description: The global employee roster, its models, and retained threads.
  - name: Templates
    description: The §4.12 harness-template catalogue.
  - name: Runs
    description: Recorded ephemeral harnesses spawn-to-teardown.
  - name: Queue
    description: The cross-Story Author queue (the home desk).
  - name: Loop
    description: The loop's own settings - the one ceiling its threads run under (S-5).
  - name: Stream
    description: The Server-Sent Events change feed.
paths:
  /v1/storyline/stories:
    get:
      tags: [Stories]
      operationId: listStories
      summary: List the Stories panel rows
      description: >-
        One `StoryRow` per Story, already ordered by the server's attention rule: stalled Stories
        first, then Stories waiting on the Author, then everything else, with `id` breaking ties.
        Each row carries the criteria engine's rendered level strings (`n/m`, `n/a`, or
        `n/m · failing: ...`), the live run count, the dial, and whether completion is proposed.
        The dashboard renders these rows directly and never re-sorts or re-derives a level.
      responses:
        '200':
          description: All Story rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoryRow'
    post:
      tags: [Stories]
      operationId: createStory
      summary: Create a Story from an Author Seed
      description: >-
        Creates the Story with its empty Summary and default Goal. `idea` is the Seed and is
        required; `title` is optional (the server may name an untitled Story from the Seed);
        `chapter_count` is Author truth and defaults to the server's own count when omitted
        (D-3b: declared, never agent-chosen). The answer is the rendered row, not the raw record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoryRequest'
            examples:
              basic:
                summary: Seed plus title and count
                value:
                  title: The Salt Cartographer
                  idea: A mapmaker finds her own coastline redrawn on a chart she surveyed herself.
                  chapter_count: 2
      responses:
        '200':
          description: Created Story row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/storyline/stories/{id}:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    get:
      tags: [Stories]
      operationId: getStory
      summary: Read the whole Story region
      description: >-
        The one round trip THE STORY region needs: the Story record plus the Summary, plotlines,
        chapters, cast, ledger, Goal surface, Ideas, revisions (and their verdicts), findings,
        proposals, runs, assigned template ids, cost distribution, completion preview, current
        Digest, and the retained round history. Every slice is the §4 collection as stored;
        computed values come from the criteria/digest engines, never from the client.
      responses:
        '200':
          description: Story view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryView'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Stories]
      operationId: patchStory
      summary: Edit the four Author-owned Story row fields
      description: >-
        Changes the display title, the Seed, the declared chapter count, or the cost dial. At
        least one field must be present. Editing the Seed is a backtrack to phase ① (D-25a);
        changing the count grows or shrinks the chapter set through the engine (D-3c). A title or
        dial edit is attributed to the Author in one commit. The answer is the refreshed row.
        The dial is a COST dial and never a kind override (D-33d): while the Story carries an
        unresolved issue, the auto-approve sweep skips a `kind: proposal` row whatever its cost,
        and the row stays on the desk for the pass that has no issue left.
        `editor_group_locking` is the R-lock permission switch: a BOOLEAN, never a truthy blob,
        because the Setting's whole effect is a yes/no the domain reads as `=== true`. `true` hands the
        Editor one judgement seat per Summary section per clean vector, in which it may declare a
        section finished and lock it; `false` takes that power back at once, and omitting the key leaves
        the Story exactly as it was. Turning it off does NOT lift a lock an Editor already set — the flag
        lives on the group row, and only this contract's unlock verb, called by the Author, clears it.
        The refreshed row this PATCH answers is the row-shaped read, which does not carry the Setting;
        read it back from `GET /stories/{id}`'s `story` record.
        `plotlines_mode` is Phrase ②'s dial (R11) and the one field here with a start-time gate: it moves
        only while no Plotlines Phrase row exists, and its 409 says which row stands in the way. The two
        dials are independent — a Story may run the Summary as groups and Phrase ② classic, or the other way
        round, and this route never edits one as a side effect of the other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchStoryRequest'
            examples:
              dial:
                summary: Let only critical and major findings skip the desk
                value:
                  auto_approve: [critical, major]
      responses:
        '200':
          description: Updated Story row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Stories]
      operationId: deleteStory
      summary: Delete a Story and everything its harness owns
      description: >-
        One coordinated purge. The Story is paused so no sweep starts a run behind the delete, its
        runs in flight are killed and awaited, every Story-scoped §4 record goes in one commit with
        its harness session, its retained threads are pruned, its knowledge directory is removed and
        its projection closed, and only then is its book closed and its `stories/<uuid>/` directory -
        `store.json`, `journal.jsonl` and the whole `harness/` tree - deleted. A restarted workspace
        therefore never reopens a Story the Author deleted. The receipt names the Story that is gone.
        There is no cascade in the other direction: the host configuration at `server/` and every
        other Story's book, rows, journal and harness files are left exactly as they were.
      responses:
        '200':
          description: Deletion receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStoryResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/storyline/stories/{id}/knowledge:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    get:
      tags: [Knowledge]
      operationId: getStoryKnowledge
      summary: Read the Story's durable knowledge directory
      description: >-
        Nine folders (research, summary, plotlines, chapters, cast, continuity, goal, ideas,
        findings), one knowledge article per folder, each entry a paragraph. `research` mirrors the
        Story's `knowledge` rows (the Researcher's artifact, §3.2): one paragraph per entry with its
        importance, kind, topic, claim, detail and source, sorted critical → high → normal → low and
        capped at 30 entries with a trailing count. The server re-derives the sections from the book
        and flushes the article bytes before answering, so a commit that landed since the last sync
        is visible and durable in this response. An unavailable knowledge store answers
        `degraded: true` rather than failing the read.
      responses:
        '200':
          description: Knowledge tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryKnowledgeTree'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/storyline/stories/{id}/phrases:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    get:
      tags: [Stories]
      operationId: getStoryPhrases
      summary: Read the Summary as groups (phrases, groups, findings, tasks, review state)
      description: >-
        The Summary Phrase view (R6): the catalog groups with their current text, revision numbers and
        retained history, the composed Overview, every finding with its group scope and R3's resolution
        (which targeted groups already have a revision written to answer it), the open group tasks, and
        the review state — which groups are still unwritten, the current group vector, how many Critic
        seats have reported on THAT text, and whether the legacy `summaries` prose still agrees with the
        groups it mirrors. A pure read: nothing here migrates or rewrites a book. A Story written before
        the redesign answers `mode: sampling` with empty groups rather than 404, because an absent
        `summary_mode` means the legacy whole-Summary pipeline, and its rows stay exactly as they are.
      responses:
        '200':
          description: The group view of one Story.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseView'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/storyline/stories/{id}/phrases/import:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    post:
      tags: [Stories]
      operationId: importStoryPhrases
      summary: Turn a legacy flat Summary into groups (the one explicit upgrade step)
      description: >-
        The only way a book written before the Summary Phrase redesign becomes group-managed (R6). A
        read never migrates anything, and moving the Author's prose into a group history is their
        decision, so this call is the switch: it creates any missing catalog rows, gives every group
        whose legacy field is non-empty exactly one revision at number 1 (`state: latest`, `run_ref:
        null` — no run wrote it, the existing text is preserved rather than re-authored), leaves an
        empty group at revision 0, and sets `summary_mode` to `groups`. Idempotent by SKIPPING: a group
        that already has a revision is untouched, so pressing again writes nothing and a partial first
        attempt is safe to retry. The `summaries` row itself is not rewritten — the mirror's direction
        is groups → legacy, and it belongs to the install commit.
      responses:
        '200':
          description: The import result plus the fresh group view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseImportResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/storyline/stories/{id}/phrases/{key}:
    parameters:
      - $ref: '#/components/parameters/StoryId'
      - $ref: '#/components/parameters/PhraseKey'
    get:
      tags: [Stories]
      operationId: getStoryPhrase
      summary: Read one Phrase's rail state — ① Summary or ② Plotlines
      description: >-
        The one read a phrase rail needs, and the shape Phrase ③'s rail will reuse: everything
        `GET …/phrases` sends, scoped to THIS phrase's catalog rows rather than to the Summary, plus the
        three fields a phrase with its own start verb cannot do without — `key`, the SEED PREVIEW
        (`seed_chars`, the exact length of the Seed stored on the Phrase row, and `seed_head`, a leading
        window of it), and the `brief` block (§4.11: every phrase's rail carries its own brief — today
        that is Phrase ②'s chapter plan, and the same slot carries Phrase ③'s when that wave lands). The
        group rows are this phrase's only, so a Plotlines rail never shows the Summary's five sections;
        `findings` and `review` are scoped to the groups this phrase owns, and `tasks` stay Story-scoped
        because a §4.10 task carries no phrase column — the rail shows the queue the loop is working
        through, not a slice of it. An unwritten phrase answers the EMPTY shape with `mode` naming its
        dial rather than 404, exactly the rule R6 sets for the Summary. ONE scope rule is phrase-specific
        and this is the whole of it: `review.mirror` is the legacy `summaries` prose, so it is carried on
        the Summary's read only — on Phrase ② there is no second store to keep in step, and the key is
        absent rather than null.
      responses:
        '200':
          description: The phrase read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseDetailView'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/storyline/stories/{id}/phrases/{key}/start:
    parameters:
      - $ref: '#/components/parameters/StoryId'
      - $ref: '#/components/parameters/PhraseKey'
    post:
      tags: [Stories]
      operationId: startStoryPhrase
      summary: Start an on-demand Phrase — Phrase ② begins from a Seed the Author chooses
      description: >-
        R5 / D-72: the loop does not walk into Phrase ② by itself, and the Seed it starts from is the
        Author's decision, not an agent's. The body picks the Seed: `source: compiled` (the default, and
        what an empty body means) copies THIS Story's compiled Summary text — the same bytes the loop's
        phase-② prompt compiles, read off the `summaries` row rather than off an agent's answer — and
        `source: custom` copies the Author's own `text`. Either way the Seed is COPIED onto the Phrase row
        and is NOT live after that: editing `stories.idea` or the Summary later does not move the phrase,
        because the chapter plan is judged against the text that was actually handed over (D-72). The verb
        is deliberately phase-AGNOSTIC — starting ② is the Author's move and the loop never requires it —
        and the chapter catalog is seeded inside the SAME commit, so the rail's first read after a start
        already has group rows to show.
        THE SUMMARY ACCEPT PERFORMS THIS START (T12/R4). Accepting the final Summary — `POST
        /v1/storyline/stories/{id}/lock` while the Story is in phase ① — runs THIS verb's `source: compiled`
        arm for the Author, in a commit of its own right after the lock, and reports the outcome on the
        lock's `lock_receipt` (`phrase_started`, `phrase_start_reason`) rather than as a refusal: an accept
        that finds nothing compiled to copy, or a phrase that is already started, leaves the Summary locked
        and says so in a 200. THIS verb remains available and unchanged — it is the only way to hand Phrase
        ② the Author's own `text`, it is the move that starts the phrase after the dial moves to `'groups'`,
        and it is the move that finishes the job when the accept had nothing to copy. Its refusals stay
        exactly as written above: an accept REPORTS a start it could not make, a manual start REFUSES it.
        REFUSALS: 400 when `source: custom` arrives without a non-blank `text` (a blank Seed would start
        the crew on nothing, and this verb does not author prose on the Author's behalf); 409 when `source:
        compiled` finds no compiled Summary to copy — a Story whose Summary is still flat text is named,
        with the import verb that changes it; 409 when the phrase has ALREADY been started, naming its
        row, because starting again would throw away the chapter plan the crew is working from (re-seeding
        is a backtrack, not this verb). A `key` outside the §4.11 catalog is 404; a catalog phrase that is
        NOT `starts_on_demand` — Phrase ①, which the loop writes — is 409 rather than 404, because the
        phrase exists and starting it by hand is the impossible part.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPhraseRequest'
            examples:
              compiled:
                summary: Start from this Story's compiled Summary (the default)
                value:
                  source: compiled
              custom:
                summary: Start from the Author's own Seed
                value:
                  source: custom
                  text: Three years after the tide charts were withdrawn, the salt roads reopen.
      responses:
        '200':
          description: The start report (the Seed's exact length and its leading window) plus the fresh phrase read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPhraseResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/storyline/stories/{id}/phrases/groups/{groupId}/revise:
    parameters:
      - $ref: '#/components/parameters/StoryId'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
        description: >-
          The `phrase_groups.id` (a UUID the `GET …/phrases` view reports), not the catalog key. An id
          this Story does not own is 404 rather than a write against a group nobody named.
    post:
      tags: [Stories]
      operationId: revisePhraseGroup
      summary: The Author rewrites one Summary group
      description: >-
        The Author's own write on one group, through the same install the loop uses: a new revision row
        at THAT group's next number, the text it replaces archived and retained, every sibling group
        untouched with its own number unchanged, the Overview recomposed from the rows, and the legacy
        `summaries` prose fields rewritten in the same commit (R2, R6). The row claims to resolve no
        finding — `finding_refs` stays off it — so a hand edit cannot close a finding on the evidence
        rule that belongs to a dispatched pass (R3). A `summary_mode: sampling` book is 409: it has no
        group rows, and importing is an explicit decision. A group a LIVE Writer pass is rewriting is 409
        as well, naming the run that holds it: this route is one Writer operation on that group, and R4
        allows only one at a time — the edit lands unchanged once that run closes. A group that is LOCKED is
        409 for the same reason the loop is refused: the install refuses the whole batch before its first
        write, because settled text is the fixed point the other groups are revised against (R-lock) — the
        Author's unlock is the move that makes a hand edit possible, and this route never overrules a lock
        the Author made by hand or the crew made from a judgement seat.
        WHICH PHRASE a group belongs to is read from the GROUP ROW, never assumed: the five Summary
        sections answer with the `PhraseView` shape under the `summary_mode` gate above, and a CHAPTER group
        (`key: chapter_<n>`, Phrase ②) answers with the `PhraseDetailView` shape under Phrase ②'s own
        switch — `plotlines_mode: groups` plus a started phrase, or the P4 409 naming both verbs. On that
        leg the body's text is `plotpoints` (the chapter's four contract fields), not `content`; see
        `PhraseGroupReviseRequest`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhraseGroupReviseRequest'
      responses:
        '200':
          description: The install report plus the fresh group view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseGroupReviseResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/storyline/stories/{id}/phrases/groups/{groupId}/lock:
    parameters:
      - $ref: '#/components/parameters/StoryId'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
        description: >-
          The `phrase_groups.id` (a UUID the `GET …/phrases` view reports), exactly as on the revise
          route. An id this Story does not own is 404 before any verb runs.
          THE GATE IS THE GROUP'S OWN PHRASE's switch, read off the group row rather than assumed: a
          Summary section answers under `summary_mode` with the `…/phrases/import` sentence below, and a
          Phrase ② CHAPTER group answers under `plotlines_mode`, its 409 naming `PATCH …/stories/{id}` and
          `POST …/phrases/plotlines/start` (P4). A locked chapter group holds its text against the chapter
          crew exactly as a locked section holds it against the Summary crew — the flag, the four fields
          and the finding-voiding rule are ONE rule for both phrases, and the `view` this verb answers
          matches the phrase the group belongs to.
    post:
      tags: [Stories]
      operationId: lockPhraseGroup
      summary: The Author locks one Summary group's current text in as settled content
      description: >-
        R-lock — the Author's declaration that THIS group's current text is finished. A lock is a flag on
        the group row, never an edit: it writes the four lock fields (`locked`, `locked_revision`,
        `locked_by`, `locked_at`) and NOTHING else — no `group_revisions` row, no `content`, no Overview
        recomposition, no mirror write — so the text is byte-for-byte what it was and `locked_revision`
        names the revision a person committed to. From here the group is the fixed point: `installGroupRevisions`
        refuses any batch that rewrites it, the work generator never offers it, and every unlocked group is
        revised to agree with it rather than the other way round. Findings are voided rather than resolved:
        a claim whose EVERY named group is now locked becomes `discarded` (the established void state), and
        a claim that also names an unlocked group stays open for the groups that can still move.
        WHO ACTS: this route always acts as the AUTHOR, whoever set the lock before. The Editor's leg is a
        judgement SEAT, not a verb — on a Story with `editor_group_locking` on, the loop arms one seat per
        section per clean vector (`wi_group_lock_<cleanVectorHash>_<groupId>`), the Editor weighs the
        Critic's open claims and the Reader's rationale for that ONE section, and a `lock: true` answer
        performs this same write with `locked_by: editor` inside the settle commit. That seat never UNLOCKS,
        and no tool path reaches this flag from a run: the flag has exactly one Author surface, this route.
        REFUSALS, each a 409 with its own sentence: the group has no written text, so there is no revision
        for a lock to fix; it is ALREADY locked, and the move that reopens it is the unlock — a second lock
        refuses rather than re-dating the decision the book already carries; or a LIVE Writer pass holds the
        group, naming the run ids, because a lock fixes a revision and freezing text a pass is about to
        replace would fix words nobody has read. A `groupId` this book never minted is 404 before any verb,
        and a `summary_mode: sampling` book is 409 naming `POST …/phrases/import`.
      responses:
        '200':
          description: The lock report (the revision it fixed, who set it, the claims it voided) plus the fresh group view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseGroupLockResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/storyline/stories/{id}/phrases/groups/{groupId}/unlock:
    parameters:
      - $ref: '#/components/parameters/StoryId'
      - name: groupId
        in: path
        required: true
        schema:
          type: string
        description: >-
          The `phrase_groups.id` of a LOCKED group. The verb is the Author's alone whoever set the lock,
          so a lock the Editor committed on a Story that enables it is lifted here, by the Author.
          THE GATE IS THE GROUP'S OWN PHRASE's switch, exactly as on the lock verb: a Summary section is
          gated by `summary_mode`, a Phrase ② chapter group by `plotlines_mode`, and the fresh phrase read
          this verb answers matches the phrase the group belongs to.
    post:
      tags: [Stories]
      operationId: unlockPhraseGroup
      summary: The Author lifts a group's lock and hands the text back to the loop
      description: >-
        R-lock — the one move that reopens settled text, and the Author's alone: a crew that just closed a
        defect may not sign the book back out. Like the lock it writes no revision and touches no `content`
        — the signed-off text is byte-for-byte what it was — and it clears the three metadata fields to
        `null` (`locked: false` is the effective state, and the row says so). It does NOT resurrect the
        findings the lock voided: `discarded` is terminal in §4.10, and a defect the crew still believes in
        is filed again by the next Critic pass against the now-writable text. The group is offered to the
        work generator again on the next sweep, and a claim that still names it becomes actionable for it
        again as a READ — nothing is rewritten to make the queue move.
        REFUSALS, each a 409 with its own sentence: the group is NOT locked, so there is nothing to lift; a
        LIVE Writer pass holds the group, naming the run ids — the lock may be holding off an install
        dispatched before it, and opening the group under that pass would land text nobody reviewed on the
        section the Author just reopened. A `groupId` this book never minted is 404 before any verb, and a
        `summary_mode: sampling` book is 409 naming `POST …/phrases/import`. Turning
        `editor_group_locking` off is NOT an unlock and lifts nothing: the Setting governs whether the
        Editor's seat is armed, never whether a flag on a group row stands.
      responses:
        '200':
          description: The unlock report (the revision that stops being fixed text) plus the fresh group view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseGroupUnlockResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/storyline/stories/{id}/phrases/reviewed/choose:
    parameters:
      - $ref: '#/components/parameters/StoryId'
    post:
      tags: [Stories]
      operationId: chooseReviewedSummary
      summary: The Author chooses the Reviewed Summary — the Summary phrase's own verb (D-68)
      description: >-
        The decision the phase exists for: the reviewed Overview — the newest CLEAN revision of every
        group, the text a cross-group Critic pass read with no unresolved defect on it — becomes the
        book. ONE commit does four things: installs each selected text as its group's next `latest`
        (the same install the loop and the hand-edit route use, so the Overview recomposes from the rows
        and the legacy `summaries` prose is rewritten in the same commit — R2, R6), marks every revision
        the choice passed over `discarded`, records the chosen vector on the Phrase row, and writes the
        journal. It does NOT lock the phase — choosing is not locking, the loop keeps running and the
        next cross-group pass may still find a defect in the chosen text — and it claims to resolve
        nothing: the new rows carry no `finding_refs`, so a choice never closes a finding on R3's
        evidence rule, exactly as on the hand-edit route.

        The rows the choice set aside PERSIST rather than being deleted, and that is load-bearing: R3's
        closure join walks the whole history with no state filter, so a finding that a discarded revision
        closed stays `fixed`. They are terminal, though — hidden from every current read and never
        selected again.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhraseReviewedChooseRequest'
      responses:
        '200':
          description: The choose report plus the fresh group view (the live Overview now IS the reviewed one).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhraseReviewedChooseResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
