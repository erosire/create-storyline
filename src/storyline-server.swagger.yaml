          $ref: '#/components/schemas/StoryPhase'
        role:
          $ref: '#/components/schemas/RoleKind'
        role_name:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/AgentThreadState'
        started_at:
          type: string
        ended_at:
          type: string
        tokens:
          type: integer
        request:
          type: string
        answer:
          type: string
        error:
          type: string
        retained:
          type: boolean
    AgentThreadList:
      type: object
      required: [kind, threads]
      additionalProperties: false
      properties:
        kind:
          type: string
        threads:
          type: array
          items:
            $ref: '#/components/schemas/AgentThreadRecord'
    # ---------------------------------------------------------------------
    # Request bodies
    # ---------------------------------------------------------------------
    CreateStoryRequest:
      type: object
      required: [idea]
      additionalProperties: false
      properties:
        title:
          type: string
        idea:
          type: string
          minLength: 1
          description: P5's Seed. A blank or whitespace-only value is 400.
        chapter_count:
          type: integer
          minimum: 1
    PatchStoryRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        idea:
          type: string
          minLength: 1
        chapter_count:
          type: integer
          minimum: 1
        auto_approve:
          type: array
          items:
            $ref: '#/components/schemas/Cost'
    BacktrackRequest:
      type: object
      required: [phase]
      additionalProperties: false
      properties:
        phase:
          type: string
          enum: [summary, plotlines]
    WhyRequest:
      type: object
      required: [why]
      additionalProperties: false
      properties:
        why:
          type: string
          minLength: 1
          description: The audit sentence an approval or discard must carry (D-8/T-5).
    NoteRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          description: >-
            The Author's note. On an Idea selection it is the explicit acknowledgement when a
            sourced Idea has no `verified` Editor verdict; on a revision selection it lands in
            `selection_note` and defaults to the server's own sentence when absent or blank.
    SectionContentRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          description: The complete section text (not a patch); an empty string is a valid paragraph-free section.
    RevisionMergeRequest:
      type: object
      required: [unit_ref, revision_ids, parts]
      additionalProperties: false
      properties:
        unit_ref:
          type: string
        revision_ids:
          type: array
          minItems: 2
          items:
            type: string
        parts:
          type: string
          description: The merge brief - which half of which draft to take.
        why:
          type: string
          description: Optional audit sentence; the server writes its own when absent.
    UndoRequest:
      type: object
      required: [chapter_id, section_id]
      additionalProperties: false
      properties:
        chapter_id:
          type: string
        section_id:
          type: string
    DirectiveRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
        refs:
          type: array
          items:
            type: string
          description: Artifact ids naming the pane the Author is looking at.
    TemplateAssignRequest:
      type: object
      required: [template_ids]
      additionalProperties: false
      properties:
        template_ids:
          type: array
          items:
            type: string
    ChapterBarRequest:
      type: object
      required: [bar_override]
      additionalProperties: false
      properties:
        bar_override:
          type: string
          description: 'Whitespace-separated tokens such as `-C-7 +1`; an empty string clears the override.'
    GoalCriterionOp:
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op:
          type: string
          enum: [add, remove, setHard]
        id:
          type: string
        criterion:
          $ref: '#/components/schemas/Criterion'
        hard:
          type: boolean
    GoalUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        threshold_soft:
          type: number
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/GoalCriterionOp'
    AssistantRequest:
      type: object
      required: [target, text]
      additionalProperties: false
      properties:
        target:
          type: string
          enum: [summary, directive]
        text:
          type: string
          minLength: 1
    AgentModelUpdateRequest:
      type: object
      required: [model]
      additionalProperties: false
      properties:
        model:
          type: string
          nullable: true
          description: A non-empty provider model id, or `null` to clear the roster choice.
    CreateTemplateRequest:
      type: object
      description: >-
        One of `template` (New) or `duplicate_of` (Duplicate) is required; when both are present
        the route duplicates the named row. An Author template is always created as
        `builtin: false, editable: true`.
      additionalProperties: false
      properties:
        template:
          $ref: '#/components/schemas/Template'
        duplicate_of:
          type: string
    TemplateUpdateRequest:
      type: object
      description: A partial template; omitted fields keep their stored value.
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TemplateRole'
        serves_phase:
          type: array
          items:
            $ref: '#/components/schemas/StoryPhase'
        done_definition:
          type: string
        selection_rules:
          type: string
        attempts:
          type: integer
        delegation:
          type: array
          items:
            type: string
        escalation_rule:
          type: string
        next_phase:
          type: string
        max_concurrent:
          type: integer
        builtin:
          type: boolean
        editable:
          type: boolean
