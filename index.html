<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#101317" />
        <meta
            name="description"
            content="Storyline — an AI story-writing workspace (Writer / Reader / Editor agents)."
        />
        <title>Storyline</title>
        <style>
            /* Document scaffolding ONLY — the dashboard skin (T2 owns
               src/dashboard/styles/**) owns palette, typography, form controls
               and scrollbars. Everything here is layout plumbing that the React
               tree cannot supply before it mounts. */
            /* Height chain so a 100vh station and a 100% #root agree. */
            html,
            body,
            #root {
                height: 100%;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            /* The dashboard ships one flat ink skin, so the pre-JS document hint
               names the same scheme the skin paints (a light OS hint would flash
               white form controls and a white canvas before React mounts). */
            :root {
                color-scheme: dark;
                background: #101317;
            }
            body {
                margin: 0;
                background: #101317;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
